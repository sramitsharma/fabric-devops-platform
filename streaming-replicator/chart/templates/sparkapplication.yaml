apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: replicator-{{ .Values.tenant.id }}
  namespace: tenant-{{ .Values.tenant.id }}
spec:
  type: Python
  mode: cluster
  image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"  # digest-pinned
  mainApplicationFile: local:///opt/app/main.py
  sparkVersion: 3.5.1
  restartPolicy: { type: Always, onFailureRetryInterval: 30 }
  driver:
    cores: 1
    memory: 2g
    serviceAccount: replicator-{{ .Values.tenant.id }}   # per-tenant Workload Identity
    labels: { azure.workload.identity/use: "true", tenant: "{{ .Values.tenant.id }}" }
    envFrom: [ { secretRef: { name: replicator-{{ .Values.tenant.id }}-s3 } } ]  # via ESO/KV
    env:
      - { name: TENANT_ID,       value: "{{ .Values.tenant.id }}" }
      - { name: EH_NAMESPACE,    value: "{{ .Values.eh.namespace }}" }
      - { name: EH_NAME,         value: "{{ .Values.eh.hub }}" }
      - { name: S3_BUCKET,       value: "{{ .Values.s3.bucket }}" }
      - { name: S3_ENDPOINT,     value: "{{ .Values.s3.endpoint }}" }
      - { name: CHECKPOINT_PATH, value: "{{ .Values.checkpointPath }}" }
  executor:
    instances: {{ .Values.executors }}
    cores: 2
    memory: 4g
    labels: { tenant: "{{ .Values.tenant.id }}" }
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
